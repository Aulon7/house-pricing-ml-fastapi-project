[pytest]
# Without this, "pytest" fails to import the src package and only
# "python -m pytest" works. CI runs the bare command.
pythonpath = .
testpaths = tests

filterwarnings =
    # joblib sets ndarray.shape while unpickling, which NumPy 2.5 deprecates.
    # Third-party and unfixable from here; it floods the output otherwise.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
